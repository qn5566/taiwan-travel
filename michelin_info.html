       02. 曜石黑 × 酒紅燙金色塊：米其林三星紀錄與餐廳由來故事
       ========================================================================= -->
  <section class="dark-editorial-intro">
    <div class="container-narrow">

      <div class="michelin-honor-block">
        <div>
          <span class="honor-kicker">MICHELIN GUIDE TAIWAN ACCOLADES</span>
          <h2>《臺灣米其林指南》歷年獲選紀錄：連續八年三星最高榮譽</h2>
          <p>
            自 2018 年米其林指南首度登陸台灣以來，頤宮以無懈可擊的火候工藝與細膩桌邊服務，成為全台唯一蟬聯最高「三星（值得專程造訪的卓越料理）」八連霸的餐飲殿堂。
          </p>
          <div class="years-ribbon">
            <span>2018 ★★★</span>
            <span>2019 ★★★</span>
            <span>2020 ★★★</span>
            <span>2021 ★★★</span>
            <span>2022 ★★★</span>
            <span>2023 ★★★</span>
            <span>2024 ★★★</span>
            <span>2025 ★★★</span>
          </div>
        </div>
        <div class="honor-big-stat">
          <strong>08</strong>
          <span>YEARS THREE STARS</span>
        </div>
      </div>

      <div class="story-magazine-grid">
        <article class="editorial-essay">
          <h3>當法式「宮殿」遇見宋代文人雅集，重現失傳老粵菜的極致風華</h3>
          <p class="drop-cap">
            「頤宮」二字源自《易經》頤卦「觀頤，觀其所養也」，寓意飲食不僅止於味蕾的滿足，更是一場身心靈的滋養；而法文店名 <strong>Le Palais</strong> 意為「宮殿」，精準呼應君品酒店（Palais de Chine）將歐式古堡建築語彙與東方宋代美學交融的設計靈魂。自 2010 年隨飯店開幕以來，團隊便立下「復興失傳手工老粵菜」與「極致港式點心」的雙軸定位。
          </p>
          <p>
            在廣東菜講究「清、鮮、嫩、滑、爽、香」的傳統根基上，頤宮廚藝團隊嚴選台灣在地頂級山海食材，將繁複費時的古法工藝推向當代藝術高度。無論是需耗時數日風乾烤製、於桌邊點燃君度橙酒綻放藍色火光的<strong>「火焰片皮鴨」</strong>，或是以老母雞與金華火腿慢火熬煮八小時的上湯名菜，每一道端上桌的瓷盤，都展現了華人頂級宴席無可取代的深度與底蘊。
          </p>
        </article>

        <aside class="editorial-pullquote-box">
          <span class="quote-mark">“</span>
          <blockquote>
            將看似家常的叉燒與豆腐奶，透過毫釐不差的油溫與火候，昇華為令國際美食評審驚嘆的藝術品。
          </blockquote>
          <cite>— TAIWAN ROAM MICHELIN EDITION</cite>
        </aside>
      </div>
