  <script>
    let currentMichCategory = "all";

    document.addEventListener("DOMContentLoaded", () => {
      renderMichelinList();
    });

    function filterMichelin(cat) {
      currentMichCategory = cat;
      document.querySelectorAll(".city-pill-btn").forEach(btn => btn.classList.remove("active"));
      if (cat === "all") document.getElementById("btn-mich-all").classList.add("active");
      if (cat === "three_two") document.getElementById("btn-mich-three").classList.add("active");
      if (cat === "one_star") document.getElementById("btn-mich-one").classList.add("active");
      if (cat === "bib") document.getElementById("btn-mich-bib").classList.add("active");
      renderMichelinList();
    }

    function renderMichelinList() {
      const container = document.getElementById("michelin-cards-grid");
      if (!container) return;

      let list = [];
      if (typeof TAIPEI_MICHELIN_STARS_DATA !== "undefined") {
        list = list.concat(TAIPEI_MICHELIN_STARS_DATA);
      }
      if (typeof BIB_GOURMAND_DATA !== "undefined") {
        list = list.concat(BIB_GOURMAND_DATA);
      }

      const filtered = list.filter(item => {
        if (currentMichCategory === "all") return true;
        if (currentMichCategory === "three_two") return item.category === "three_two" || (item.stars && (item.stars.includes("三星") || item.stars.includes("二星")));
        if (currentMichCategory === "one_star") return item.category === "one_star" || (item.stars && item.stars.includes("一星"));
        if (currentMichCategory === "bib") return item.badge && item.badge.includes("必比登");
        return true;
      });

      container.innerHTML = filtered.map(item => {
        const starTag = item.stars || item.badge || "⭐ 米其林評鑑";
        const isBib = starTag.includes("必比登");
        const tagBg = isBib ? "#FEF3C7" : "#FFE4E6";
        const tagColor = isBib ? "#92400E" : "#BE123C";
        const mapUrl = AFFILIATE_HUB.getMapUrl(item.name.replace("台北 ｜ ", ""));
        const diningUrl = AFFILIATE_HUB.getDiningUrl();

        return `
          <div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 20px; overflow: hidden; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; transition: transform 0.3s ease;">
            <div style="position: relative; width: 100%; height: 210px; overflow: hidden; background: #E2E8F0;">
              <img src="${item.img || 'https://images.unsplash.com/photo-1544025162-d76694265947?w=600&auto=format&fit=crop'}" alt="${item.name}" style="width: 100%; height: 100%; object-fit: cover;">
              <span style="position: absolute; top: 14px; left: 14px; background: ${tagBg}; color: ${tagColor}; font-size: 12px; font-weight: 800; padding: 4px 12px; border-radius: 9999px; box-shadow: 0 4px 10px rgba(0,0,0,0.15);">
                ${starTag}
              </span>
            </div>
            <div style="padding: 24px; display: flex; flex-direction: column; flex: 1;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <span style="font-size: 13px; font-weight: 700; color: #0284C7;">📍 ${item.city || '台北市'}</span>
                <span style="font-size: 13px; font-weight: 800; color: #D97706;">${item.cuisine || item.categoryName || '台灣風味'}</span>
              </div>
              <h3 style="font-size: 18px; font-weight: 800; color: #0F172A; margin-bottom: 8px;">${item.name}</h3>
              <p style="font-size: 13px; color: #64748B; line-height: 1.6; margin-bottom: 14px; flex: 1;">${item.feature || item.desc}</p>
              
              <div style="background: #F8FAFC; border-radius: 10px; padding: 10px 12px; font-size: 12px; color: #334155; margin-bottom: 16px;">
                <div><strong>均消：</strong> ${item.price || 'NT$ 300 - 1,500'}</div>
                <div style="margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"><strong>地址：</strong> ${item.address || item.city}</div>
                ${item.dishes ? `<div style="margin-top: 3px;"><strong>必點：</strong> ${item.dishes}</div>` : ''}
              </div>

              <div style="display: flex; gap: 10px; margin-top: auto;">
                <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="btn-action btn-maps-nav" style="flex: 1; text-align: center; padding: 9px; font-size: 12px;">
                  📍 Map
                </a>
                <a href="${diningUrl}" target="_blank" rel="noopener noreferrer" class="btn-action btn-klook-book" style="flex: 1; text-align: center; padding: 9px; font-size: 12px;">
                  🍽️ 優惠餐券 / 搶位
                </a>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }
  </script>
