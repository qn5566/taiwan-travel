    let currentThemeId = "hualien";

    function initThemesPage() {
      // 讀取 URL ?theme=...
      const urlParams = new URLSearchParams(window.location.search);
      const param = urlParams.get('theme');
      if (param && THEMES_COMPLETE_DATA.some(t => t.id === param)) {
        currentThemeId = param;
      }

      renderDeckFan();
      renderAllPills();
      renderThemeMainContent(currentThemeId);
    }

    // 渲染圖二扇形疊牌 (Fanned Deck)
    function renderDeckFan() {
      const stage = document.getElementById("deck-fan-stage");
      const deckCount = THEMES_COMPLETE_DATA.length;
      
      // 計算扇形旋轉角度與垂直偏移 (Curved Fan Spread)
      stage.innerHTML = THEMES_COMPLETE_DATA.map((t, idx) => {
        const offsetFromCenter = idx - (deckCount - 1) / 2;
        const rotateDeg = offsetFromCenter * 5.5; // 每張傾斜 5.5 度
        const translateY = Math.abs(offsetFromCenter) * 12; // 兩側向下弧形落差
        const isDrawn = t.id === currentThemeId;

        return `
          <div class="fan-card-item ${isDrawn ? 'drawn' : ''}" 
               style="transform: translate(${offsetFromCenter * 80}px, ${translateY}px) rotate(${rotateDeg}deg); z-index: ${idx + 1};"
               onclick="drawCard('${t.id}')">
            <div class="fan-card-inner">
              <img src="${t.deckBg}" alt="${t.name}" class="fan-card-bg-img">
              <div class="fan-card-overlay"></div>
              <span class="fan-card-badge">${t.icon} ${t.shortTitle}</span>
              <div class="fan-card-info">
                <div class="fan-card-icon">${t.icon}</div>
                <div class="fan-card-title">${t.shortTitle}</div>
                <div class="fan-card-subtitle">${t.name}</div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 抽牌動作 (Card Draw Effect)
    function drawCard(themeId) {
      currentThemeId = themeId;
      renderDeckFan();
      renderAllPills();
      renderThemeMainContent(themeId);
      window.history.pushState({}, '', `?theme=${themeId}`);
    }

    // 渲染全部主題快速切換膠囊
    function renderAllPills() {
      const pillsContainer = document.getElementById("theme-all-pills");
      pillsContainer.innerHTML = THEMES_COMPLETE_DATA.map(t => {
        const active = t.id === currentThemeId;
        return `
          <button type="button" class="subtheme-tab-btn ${active ? 'active' : ''}" onclick="drawCard('${t.id}')">
            ${t.icon} ${t.name}
          </button>
        `;
      }).join('');
    }

    // 渲染選中主題的完整內容（雙欄：左側行程規劃 ＋ 右側景點地點卡牌）
    function renderThemeMainContent(themeId) {
      const theme = THEMES_COMPLETE_DATA.find(t => t.id === themeId);
      if (!theme) return;

      const display = document.getElementById("theme-main-display");

      display.innerHTML = `
        <!-- 主題視覺橫幅 -->
        <div class="theme-banner-box" style="background-image: linear-gradient(180deg, rgba(15,23,42,0.2) 0%, rgba(15,23,42,0.85) 100%), url('${theme.bannerImg}');">
          <div style="position: relative; z-index: 2; color: #FFFFFF; max-width: 820px;">
            <span style="background: rgba(2, 132, 199, 0.85); color: #FFFFFF; font-size: 11px; font-weight: 800; padding: 4px 12px; border-radius: 9999px; display: inline-block; margin-bottom: 10px;">
              ${theme.icon} ${theme.name}
            </span>
            <h2 style="font-size: 30px; font-weight: 900; margin-bottom: 8px; color: #FFFFFF; line-height: 1.25;">
              ${theme.title}
            </h2>
            <p style="font-size: 14px; color: #E2E8F0; line-height: 1.6; margin-bottom: 20px;">
              ${theme.subtitle}
            </p>
            
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
              <a href="${theme.bookingCta.charter}" target="_blank" rel="noopener noreferrer" class="btn-action btn-klook-book" style="padding: 9px 18px; font-size: 13px;">
                🚗 預約專屬包車司機 ➔
              </a>
              <a href="${theme.bookingCta.hotel}" target="_blank" rel="noopener noreferrer" class="btn-action" style="background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.4); color: #FFFFFF; padding: 9px 18px; font-size: 13px; font-weight: 700; text-decoration: none;">
                🏨 查周邊住宿早鳥比價 ➔
              </a>
            </div>
          </div>
        </div>

        <!-- 雙欄主架構：左側行程安排 ＋ 右側景點地點卡片 -->
        <div class="theme-split-layout">
          
          <!-- 左側欄：第一區塊（一日、二日、三日推薦行程規劃 ＋ 特色體驗） -->
          <div>
            <div class="itinerary-sidebar-card">
              <div style="font-size: 18px; font-weight: 900; color: #0F172A; margin-bottom: 6px; display: flex; align-items: center; gap: 8px;">
                <span>📅</span>
                <span>經典行程推薦與規劃</span>
              </div>
              <p style="font-size: 12px; color: #64748B; margin-bottom: 20px;">
                精選外籍旅客與自由行必訪動線，支援包車接駁與飯店預約
              </p>

              <!-- 行程列表 -->
              ${theme.itineraries.map(it => `
                <div style="margin-bottom: 18px;">
                  <div style="font-size: 14px; font-weight: 800; color: #0284C7; margin-bottom: 8px;">
                    ${it.planName}
                  </div>
                  ${it.days.map(d => `
                    <div class="itinerary-day-box">
                      <div class="itinerary-day-title">
                        <span>🚩 ${d.day}</span>
                      </div>
                      <div class="itinerary-day-route">${d.text}</div>
                    </div>
                  `).join('')}
                </div>
              `).join('')}

              <!-- 特色體驗主題分類 -->
              <div style="border-top: 1px dashed #CBD5E1; padding-top: 18px; margin-top: 18px;">
                <div style="font-size: 14px; font-weight: 800; color: #0F172A; margin-bottom: 12px;">
                  ✨ 本主題特色體驗分類
                </div>
                ${theme.experiences.map(exp => `
                  <div style="margin-bottom: 12px; font-size: 12.5px;">
                    <div style="font-weight: 800; color: #1E293B;">${exp.icon} ${exp.title}</div>
                    <div style="color: #64748B; margin-top: 2px; line-height: 1.4;">${exp.desc}</div>
                  </div>
                `).join('')}
              </div>

              <!-- 快捷行動按鈕組 -->
              <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 22px;">
                <a href="${theme.bookingCta.charter}" target="_blank" rel="noopener noreferrer" class="btn-action btn-klook-book" style="width: 100%; justify-content: center; padding: 11px; font-size: 13px; font-weight: 800; text-decoration: none;">
                  🚗 預約包車接送直達
                </a>
                <a href="${theme.bookingCta.hotel}" target="_blank" rel="noopener noreferrer" class="btn-action" style="background: #F1F5F9; color: #0F172A; width: 100%; justify-content: center; padding: 10px; font-size: 13px; font-weight: 700; text-decoration: none;">
                  🏨 找住宿飯店 (Booking/Trip)
                </a>
              </div>
            </div>
          </div>

          <!-- 右側欄：第二區塊（地點景點卡牌展示） -->
          <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
              <div>
                <h3 style="font-size: 20px; font-weight: 900; color: #0F172A; margin: 0;">
                  📍 ${theme.name} · 精選地點與景點卡片
                </h3>
                <span style="font-size: 12px; color: #64748B;">點選卡片查看景點詳情、預約門票與周邊包車</span>
              </div>
            </div>

            <!-- 景點卡片網格 -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px;">
              ${theme.spots.map(spot => `
                <div class="item-rich-card">
                  <div class="item-rich-img">
                    <img src="${spot.img}" alt="${spot.name}" loading="lazy">
                    <span style="position: absolute; top: 12px; left: 12px; background: rgba(15, 23, 42, 0.85); color: #FFFFFF; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 6px;">
                      ${spot.tag}
                    </span>
                  </div>
                  <div class="item-rich-body">
                    <div>
                      <h4 style="font-size: 17px; font-weight: 800; color: #0F172A; margin-bottom: 4px;">${spot.name}</h4>
                      <div style="font-size: 11px; color: #94A3B8; margin-bottom: 8px;">${spot.en}</div>
                      <p style="font-size: 12.5px; color: #475569; line-height: 1.5; margin-bottom: 16px;">${spot.desc}</p>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed #E2E8F0; padding-top: 12px;">
                      <a href="${theme.bookingCta.tour}" target="_blank" rel="noopener noreferrer" class="btn-action btn-klook-book" style="width: 100%; justify-content: center; padding: 9px; font-size: 12.5px; font-weight: 800; text-decoration: none;">
                        🎟️ 預定此景點行程 ➔
                      </a>
                      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                        <a href="${theme.bookingCta.hotel}" target="_blank" rel="noopener noreferrer" class="btn-action" style="background: #F8FAFC; border: 1px solid #CBD5E1; color: #0F172A; justify-content: center; padding: 7px; font-size: 11px; font-weight: 700; text-decoration: none;">
                          🏨 查住宿
                        </a>
                        <a href="${theme.bookingCta.charter}" target="_blank" rel="noopener noreferrer" class="btn-action" style="background: #F8FAFC; border: 1px solid #CBD5E1; color: #0F172A; justify-content: center; padding: 7px; font-size: 11px; font-weight: 700; text-decoration: none;">
                          🚗 包車接送
                        </a>
                      </div>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

        </div>
      `;
    }

    window.addEventListener("DOMContentLoaded", initThemesPage);
  </script>
</body>
</html>
