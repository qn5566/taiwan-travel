  <!-- =========================================================
       ✨ 1. 上方卡片區塊：歐美風 3D 弧形扇形卡牌展演 (Trendy Arc Deck)
       ========================================================= -->
  <section class="themes-hero-wrap">
    <div class="container">
      <h1 class="themes-hero-title">精選旅行主題探索</h1>
      <div class="themes-hero-sub">―  S I P  •  B I T E  •  W A N D E R  •  I N S P I R E  ―</div>

      <!-- 歐美風 3D 弧形扇形卡牌桌 (3D Curved Fanned Arc Deck) -->
      <div class="deck-fan-wrapper">
        <button type="button" class="deck-nav-btn deck-nav-prev" onclick="prevTheme()" aria-label="上一個主題">‹</button>
        <div class="deck-fan-stage" id="deck-fan-stage">
          <!-- 由 JS 渲染 3D 弧形卡片，切換時僅更新 transform 座標不銷毀 DOM，滑順無跳動 -->
        </div>
        <button type="button" class="deck-nav-btn deck-nav-next" onclick="nextTheme()" aria-label="下一個主題">›</button>
      </div>

      <!-- 純文字主題標題展演（中文在上、英文在下，無邊框純文字） -->
      <div class="deck-typography-display" id="deck-theme-title-display"></div>

      <!-- 快速切換主題膠囊按鈕列 -->
      <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px;" id="theme-all-pills">
        <!-- 由 JS 渲染膠囊按鈕 -->
      </div>
    </div>
  </section>

  <!-- =========================================================
       🗺️ 2. 下方雙欄區塊：左側行程動線規劃 ＋ 右側 REELS 景點推薦卡
       ========================================================= -->
  <main class="section-padding" style="padding-top: 10px; padding-bottom: 70px;">
    <div class="container">
      <div id="theme-main-display">
        <!-- 由 JS 動態注入選定主題的完整雙區塊內容 -->
      </div>
    </div>
  </main>

  <!-- 全域頁尾 -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div style="text-align: center; color: #94A3B8; font-size: 13px;">
        © 2026 台灣吃喝玩樂 Taiwan Wanderlust ‧ 官方互動圖鑑.
      </div>
    </div>
  </footer>

  <!-- 引用腳本 -->
  <script src="js/affiliate.js"></script>
  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/themes_data.js"></script>

  <script>
    let currentThemeIndex = 0; // 當前選中主題索引 (0 ~ 7)
    let currentPlanIndex = 0;  // 當前選中行程天數索引 (0: 1日遊, 1: 2天1夜, 2: 3天2夜)

    // 初始化頁面
    function initThemesPage() {
      // 讀取 URL ?theme=...
      const urlParams = new URLSearchParams(window.location.search);
      const param = urlParams.get('theme');
      if (param) {
        const foundIdx = THEMES_COMPLETE_DATA.findIndex(t => t.id === param);
        if (foundIdx !== -1) {
          currentThemeIndex = foundIdx;
        }
      }

      buildDeckDOM();
      
      // 一進入頁面即執行開場「整個攤開」偶對稱展開動畫
      requestAnimationFrame(() => {
        THEMES_COMPLETE_DATA.forEach((_, idx) => {
          const card = document.getElementById(`fan-card-${idx}`);
          if (card) {
            card.style.transitionDelay = `${idx * 0.045}s`;
          }
        });
        updateDeckPositions();
        
        // 攤開完成後清除 delay，使後續手動點選即時響應無延遲
        setTimeout(() => {
          THEMES_COMPLETE_DATA.forEach((_, idx) => {
            const card = document.getElementById(`fan-card-${idx}`);
            if (card) {
              card.style.transitionDelay = "";
            }
          });
        }, 700);
      });

      renderAllPills();
      renderThemeMainContent(currentThemeIndex, 0);
      updateThemeBackground(THEMES_COMPLETE_DATA[currentThemeIndex].id);

      // 監聽視窗縮放更新座標
      window.addEventListener("resize", debounce(() => {
        updateDeckPositions();
      }, 150));

      // 支援鍵盤左右箭頭切換
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") prevTheme();
        if (e.key === "ArrowRight") nextTheme();
      });
    }

    // 建立 3D 弧形卡片持久 DOM 結構 (僅執行一次，切換時僅更新 transform 避免跳動)
    function buildDeckDOM() {
      const stage = document.getElementById("deck-fan-stage");
      if (!stage) return;

      stage.innerHTML = THEMES_COMPLETE_DATA.map((t, idx) => `
        <div class="fan-card-item" id="fan-card-${idx}" onclick="selectThemeByIndex(${idx})" style="opacity: 0; transform: translate3d(0, 50px, 0) scale(0.85) rotate(0deg);">
          <div class="fan-card-inner">
            <img src="${t.deckBg}" alt="${t.name}" class="fan-card-bg-img" loading="lazy">
            <div class="fan-card-overlay"></div>
            
            <!-- 頂部膠囊標籤 (如同 Wixel/Alba 範例圖) -->
            <div class="fan-card-top-row">
              <span class="fan-card-pill">${t.icon} ${t.shortTitle}</span>
              <span class="fan-card-active-tag">✨ 當前主題</span>
            </div>

            <!-- 底部資訊面版 -->
            <div class="fan-card-bottom-info">
              <div class="fan-card-category">THEME 0${idx + 1} · CURATED</div>
              <div class="fan-card-title">${t.name}</div>
              <div class="fan-card-action">解鎖專題行程 ➔</div>
            </div>
          </div>
        </div>
      `).join('');

      // 為每張卡片綁定優雅 Hover，保持原本軸線微浮，絕不跑位亂跳！
      THEMES_COMPLETE_DATA.forEach((_, idx) => {
        const card = document.getElementById(`fan-card-${idx}`);
        if (!card) return;

        card.addEventListener('mouseenter', () => {
          if (card.dataset.tx === undefined) return;
          const isDrawn = card.dataset.isDrawn === "true";
          const tx = parseFloat(card.dataset.tx);
          const ty = parseFloat(card.dataset.ty) - (isDrawn ? 10 : 22);
          const rot = parseFloat(card.dataset.rot);
          const scale = parseFloat(card.dataset.scale) * (isDrawn ? 1.02 : 1.04);
          card.style.transform = `translate3d(${tx}px, ${ty}px, 0) rotate(${rot}deg) scale(${scale})`;
          card.style.zIndex = isDrawn ? 85 : 75;
        });

        card.addEventListener('mouseleave', () => {
          if (card.dataset.tx === undefined) return;
          const tx = parseFloat(card.dataset.tx);
          const ty = parseFloat(card.dataset.ty);
          const rot = parseFloat(card.dataset.rot);
          const scale = parseFloat(card.dataset.scale);
          card.style.transform = `translate3d(${tx}px, ${ty}px, 0) rotate(${rot}deg) scale(${scale})`;
          card.style.zIndex = card.dataset.zIndex || 20;
        });
      });

      // 支援移動端觸控左右滑動 (Swipe)
      attachSwipeEvents(stage);
    }

    // 計算並套用 8 張卡牌「整個攤開在偶對稱」3D 弧形展開座標 (Even Symmetry Arc Model)
    function updateDeckPositions() {
      const width = window.innerWidth;
      const isMobile = width <= 640;
      const isTablet = width > 640 && width <= 1024;
      const total = THEMES_COMPLETE_DATA.length; // 8

      // 偶對稱中心軸 (Even Symmetry Axis): 18 張卡片的中心在 8.5
      const centerAxis = (total - 1) / 2;

      // 根據卡片總數動態計算展開步伐，確保在任何卡片數量下皆完美容納於舞台
      let xSpacing = total > 10 ? 44 : 92;
      let rotStep = total > 10 ? 2.4 : 4.8;
      let archFactor = total > 10 ? 2.2 : 8.5;
      let baseScale = total > 10 ? 0.95 : 0.98;

      if (isTablet) {
        xSpacing = total > 10 ? 34 : 72;
        rotStep = total > 10 ? 1.9 : 4.0;
        archFactor = total > 10 ? 1.8 : 6.6;
        baseScale = total > 10 ? 0.88 : 0.92;
      } else if (isMobile) {
        xSpacing = total > 10 ? 19 : 38;
        rotStep = total > 10 ? 1.3 : 2.8;
        archFactor = total > 10 ? 1.2 : 4.2;
        baseScale = total > 10 ? 0.82 : 0.85;
      }

      THEMES_COMPLETE_DATA.forEach((t, idx) => {
        const card = document.getElementById(`fan-card-${idx}`);
        if (!card) return;

        // 計算偶對稱偏移量
        const offset = idx - centerAxis;
        const isDrawn = (idx === currentThemeIndex);

        card.classList.toggle("drawn", isDrawn);
        card.style.opacity = "1";
        card.style.pointerEvents = "auto";
        card.style.visibility = "visible";

        // 偶對稱座標運算
        const tx = offset * xSpacing;
        const baseRot = offset * rotStep;
        // 拋物線弧度：中央卡牌最高，兩側向下微沉呈現優美拱形 (Wixel 典雅拱弧)
        const archY = Math.pow(Math.abs(offset), 1.55) * archFactor;

        // 選中卡片抽起特效 (像卡片被抽到一樣向上拔出、微放正並放大)
        const elevation = isMobile ? -36 : -52;
        const ty = isDrawn ? (archY + elevation) : archY;
        const rot = isDrawn ? (baseRot * 0.35) : baseRot;
        const scale = isDrawn ? (baseScale * 1.09) : baseScale;

        // 層級 (Z-Index): 選中卡片永遠置頂於最前(100)，其餘卡片呈偶對稱遞減（中間在兩側上方，層層堆疊）
        const baseZ = 20 + Math.round((total / 2 - Math.abs(offset)) * 2);
        const zIndex = isDrawn ? 100 : baseZ;

        // 套用 Transform 與 Z-index
        card.style.transform = `translate3d(${tx}px, ${ty}px, 0) rotate(${rot}deg) scale(${scale})`;
        card.style.zIndex = zIndex;

        // 紀錄數值供 Hover 使用，保持完美軸線向上微浮不跑位
        card.dataset.tx = tx;
        card.dataset.ty = ty;
        card.dataset.rot = rot;
        card.dataset.scale = scale;
        card.dataset.zIndex = zIndex;
        card.dataset.isDrawn = isDrawn ? "true" : "false";
      });

      // 更新下方純文字標題展演（中文在上、英文在下，無邊框純文字）
      const titleDisplay = document.getElementById("deck-theme-title-display");
      if (titleDisplay) {
        const curTheme = THEMES_COMPLETE_DATA[currentThemeIndex];
        titleDisplay.className = `deck-typography-display theme-${curTheme.id}-active`;
        titleDisplay.innerHTML = `
          <div class="deck-display-zh">${curTheme.zhTitle}</div>
          <div class="deck-display-en">${curTheme.enTitle}</div>
        `;
      }
    }

    // 切換主題 (Select Theme)
    function selectThemeByIndex(newIndex) {
      if (newIndex < 0 || newIndex >= THEMES_COMPLETE_DATA.length) return;

      currentThemeIndex = newIndex;
      currentPlanIndex = 0; // 重設為該主題的第一個行程方案

      updateDeckPositions();
      renderAllPills();

      const theme = THEMES_COMPLETE_DATA[currentThemeIndex];
      renderThemeMainContent(currentThemeIndex, 0);
      updateThemeBackground(theme.id);

      window.history.pushState({}, '', `?theme=${theme.id}`);
    }

    // 上一個主題
    function prevTheme() {
      const newIndex = (currentThemeIndex - 1 + THEMES_COMPLETE_DATA.length) % THEMES_COMPLETE_DATA.length;
      selectThemeByIndex(newIndex);
    }

    // 下一個主題
    function nextTheme() {
      const newIndex = (currentThemeIndex + 1) % THEMES_COMPLETE_DATA.length;
      selectThemeByIndex(newIndex);
    }

    // 渲染快捷膠囊切換鈕
    function renderAllPills() {
      const pillsContainer = document.getElementById("theme-all-pills");
      if (!pillsContainer) return;

      pillsContainer.innerHTML = THEMES_COMPLETE_DATA.map((t, idx) => {
        const active = idx === currentThemeIndex;
        return `
          <button type="button" 
                  class="subtheme-tab-btn ${active ? 'active' : ''} ${active ? t.id + '-active' : ''}" 
                  onclick="selectThemeByIndex(${idx})"
                  style="cursor: pointer;">
            ${t.icon} ${t.shortTitle}
          </button>
        `;
      }).join('');
    }

    // 行程天數切換 (點擊一日遊、二日遊、三日遊方案)
    function switchPlan(planIdx) {
      currentPlanIndex = planIdx;
      renderThemeMainContent(currentThemeIndex, planIdx);
    }

    // 渲染主題主內容（左側行程安排 ＋ 右側景點卡牌）
    function renderThemeMainContent(themeIdx, planIdx = 0) {
      const theme = THEMES_COMPLETE_DATA[themeIdx];
      if (!theme) return;

      const display = document.getElementById("theme-main-display");
      if (!display) return;

      // 根據主題切換專屬暗色系面板風格
      let modeClass = "";
      if (theme.id === "baseball") modeClass = "theme-sports-mode";
      else if (theme.id === "camping") modeClass = "theme-camping-mode";
      else if (theme.id === "hotspring") modeClass = "theme-hotspring-mode";
      else if (theme.id === "railway") modeClass = "theme-railway-mode";
      else if (theme.id === "nightmarket") modeClass = "theme-nightmarket-mode";
      display.className = modeClass;

      const activePlan = theme.itineraries[planIdx] || theme.itineraries[0];
      const shortTabNames = ["一日遊", "二日遊", "三日遊", "四日遊"];

      display.innerHTML = `
        <!-- 頂部主題視覺大橫幅 (Hero Banner) -->
        <div class="theme-banner-box" style="background-image: linear-gradient(180deg, rgba(15,23,42,0.2) 0%, rgba(15,23,42,0.85) 100%), url('${theme.bannerImg}');">
          <div style="position: relative; z-index: 2; color: #FFFFFF; max-width: 840px;">
            <span style="background: rgba(2, 132, 199, 0.88); backdrop-filter: blur(8px); color: #FFFFFF; font-size: 11.5px; font-weight: 800; padding: 4px 14px; border-radius: 9999px; display: inline-block; margin-bottom: 12px; letter-spacing: 0.5px;">
              ${theme.icon} ${theme.name} · CURATED GUIDE
            </span>
            <h2 style="font-size: 32px; font-weight: 900; margin-bottom: 8px; color: #FFFFFF; line-height: 1.25; font-family: 'Noto Serif TC', serif;">
              ${theme.title}
            </h2>
            <p style="font-size: 14.5px; color: #E2E8F0; line-height: 1.6; margin-bottom: 22px;">
              ${theme.subtitle}
            </p>
            
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
              <a href="${theme.bookingCta.charter}" target="_blank" rel="noopener noreferrer" class="btn-action btn-klook-book" style="padding: 10px 20px; font-size: 13px; text-decoration: none;">
                🚗 預約專屬包車司機 ➔
              </a>
              <a href="${theme.bookingCta.hotel}" target="_blank" rel="noopener noreferrer" class="btn-action" style="background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.45); color: #FFFFFF; padding: 10px 20px; font-size: 13px; font-weight: 700; text-decoration: none;">
                🏨 查周邊住宿即時空房 ➔
              </a>
              <a href="${theme.bookingCta.tour}" target="_blank" rel="noopener noreferrer" class="btn-action" style="background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.45); color: #FFFFFF; padding: 10px 20px; font-size: 13px; font-weight: 700; text-decoration: none;">
                🎟️ 熱門票券優惠 ➔
              </a>
            </div>
          </div>
        </div>

        <!-- 下方雙欄區塊：左側行程規劃 ＋ 右側景點推薦卡 -->
        <div class="theme-split-layout">
          
          <!-- 左側欄：一日遊、二日遊、三日遊行程動線規劃 -->
          <div>
            <div class="itinerary-planner-box">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <div style="font-size: 18px; font-weight: 900; color: #0F172A; display: flex; align-items: center; gap: 8px;" class="itinerary-planner-title">
                  <span>📅</span>
                  <span>行程路線規劃</span>
                </div>
                <span style="font-size: 11px; font-weight: 700; color: #0284C7; background: #F0F9FF; padding: 3px 8px; border-radius: 6px;" class="itinerary-duration-badge">
                  ${activePlan.duration || '建議行程'}
                </span>
              </div>
              <p style="font-size: 12px; color: #64748B; margin-bottom: 16px;">
                點選下方分段標籤即可切換一日至三日專屬動線：
              </p>

              <!-- 一日遊／二日遊／三日遊 簡短按鈕 -->
              <div class="itinerary-segmented-tabs">
                ${theme.itineraries.map((plan, pIdx) => `
                  <button type="button" 
                          class="itinerary-tab-btn ${pIdx === planIdx ? 'active' : ''}" 
                          onclick="switchPlan(${pIdx})">
                    ${shortTabNames[pIdx] || `第 ${pIdx + 1} 方案`}

                `).join('')}

              <!-- 當前方案名稱 -->
              <div style="font-size: 14.5px; font-weight: 800; color: #0284C7; margin-bottom: 12px;" class="itinerary-active-planname">

              <!-- 當前選定行程方案的時間線 (Timeline Node) -->
              <div class="itinerary-day-timeline">
                ${activePlan.days.map((d, dIdx) => `
                  <div class="itinerary-timeline-node">
                    <div class="itinerary-node-badge">
                      <span>🚩</span>
                      <span>${d.day}</span>
                    </div>
                    <div class="itinerary-node-route">${d.text}</div>
                  </div>
                `).join('')}
              </div>

              <!-- 本主題特色體驗抽屜 (Experience Drawer) -->
              <div class="itinerary-exp-drawer">
                <div style="font-size: 13px; font-weight: 800; color: #0F172A; margin-bottom: 10px; display: flex; align-items: center; gap: 6px;">
                  <span>✨</span>
                  <span>主題特色亮點與體驗</span>
                </div>
                ${theme.experiences.map(exp => `
                  <div class="itinerary-exp-item">
                    <div class="exp-icon">${exp.icon}</div>
                    <div>
                      <div class="exp-title">${exp.title}</div>
                      <div class="exp-desc">${exp.desc}</div>
                    </div>
                  </div>
                `).join('')}
              </div>

              <!-- 快捷行動按鈕組 -->
              <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 18px;">
                <a href="${theme.bookingCta.charter}" target="_blank" rel="noopener noreferrer" class="btn-action btn-klook-book" style="width: 100%; justify-content: center; padding: 11px; font-size: 13px; font-weight: 800; text-decoration: none;">
                  🚗 預約包車行程直達
                </a>
                <a href="${theme.bookingCta.hotel}" target="_blank" rel="noopener noreferrer" class="btn-action" style="background: #F8FAFC; border: 1px solid #CBD5E1; color: #0F172A; width: 100%; justify-content: center; padding: 9px; font-size: 12.5px; font-weight: 700; text-decoration: none;">
                  🏨 搜尋周邊熱門住宿 (Booking)
                </a>
              </div>
            </div>
          </div>

          <!-- 右側欄：景點推薦（去除贅字、乾淨俐落） -->
          <div>
            <div class="reels-section-header" style="margin-bottom: 14px;">
              <h3 class="reels-section-title" style="font-size: 20px; font-weight: 800; margin: 0;">景點推薦</h3>
            </div>

            <!-- 景點卡片網格 -->
            <div class="reels-cards-grid">
              ${theme.spots.map(spot => `
                <div class="reels-card">
                  <img src="${spot.img}" alt="${spot.name}" class="reels-card-bg-img" loading="lazy">
                  <div class="reels-card-scrim"></div>
                  
                  <!-- 頂部標籤與愛心收藏 -->
                  <div class="reels-card-top-bar">
                    <span class="reels-card-badge">
                      ${spot.tag}
                    </span>
                    <button type="button" 
                            class="waterfall-fav-btn" 
                            onclick="toggleThemeSpotFav('${spot.name.replace(/'/g, "\\'")}', this, event)" 
                            title="收藏景點"
                            style="position: relative; width: 34px; height: 34px; background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.9); cursor: pointer;">
                      <img src="assets/icon_heart_sparkle.png" alt="收藏" style="width: 16px; height: 16px; object-fit: contain;">
                    </button>
                  </div>

                  <!-- 底部內容 -->
                  <div class="reels-card-bottom">
                    <div class="reels-spot-title">${spot.name}</div>
                    <div class="reels-spot-en">${spot.en}</div>
                    <div class="reels-spot-desc">${spot.desc}</div>
                    
                    <!-- 景點小卡牌淡雅三按鈕（包車、地圖、行程一排，不搶主視覺） -->
                    <div class="reels-card-actions-row">
                      <a href="${theme.bookingCta.charter}" 
                         target="_blank" 
                         rel="noopener noreferrer" 
                         class="reels-soft-btn">
                        🚗 包車
                      </a>
                      <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(spot.name)}" 
                         target="_blank" 
                         rel="noopener noreferrer" 
                         class="reels-soft-btn">
                        🗺️ 地圖
                      </a>
                      <a href="${theme.bookingCta.tour}" 
                         target="_blank" 
                         rel="noopener noreferrer" 
                         class="reels-soft-btn">
                        🎟️ 行程
                      </a>
                    </div>
                    <div class="reels-card-hotel-link">
                      <a href="${theme.bookingCta.hotel}" target="_blank" rel="noopener noreferrer">
                        🏨 找周邊飯店 ➔
                      </a>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

        </div>
      `;
    }

    // 收藏愛心點擊特效 (相容首頁 sparkling 愛心彈跳與小粒子)
    function toggleThemeSpotFav(spotName, btnEl, event) {
      if (event) event.stopPropagation();
      btnEl.classList.toggle("active");

      // 愛心彈跳動畫
      btnEl.style.transform = "scale(1.28)";
      setTimeout(() => {
        btnEl.style.transform = "scale(1)";
      }, 250);

      // 發射可愛彩色小粒子
      const rect = btnEl.getBoundingClientRect();
      const sparkles = ["✨", "💖", "⭐", "✦", "💫"];
      for (let i = 0; i < 5; i++) {
        const span = document.createElement("span");
        span.className = "sparkle-particle";
        span.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];
        span.style.left = `${rect.left + rect.width / 2 + (Math.random() * 30 - 15)}px`;
        span.style.top = `${rect.top + rect.height / 2 + (Math.random() * 20 - 10)}px`;
        document.body.appendChild(span);
        setTimeout(() => span.remove(), 700);
      }
    }

    // 移動端手勢滑動監聽 (Touch Swipe Support)
    function attachSwipeEvents(element) {
      let startX = 0;
      let startY = 0;

      element.addEventListener("touchstart", (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });

      element.addEventListener("touchend", (e) => {
        const endX = e.changedTouches[0].clientX;
        const endY = e.changedTouches[0].clientY;
        const diffX = endX - startX;
        const diffY = endY - startY;

        if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY)) {
          if (diffX < 0) {
            nextTheme();
          } else {
            prevTheme();
          }
        }
      }, { passive: true });
    }

    // 動態切換精選主題場景背景與專屬動畫粒子 (Dynamic Ambient Background & Particles)
    function updateThemeBackground(themeId) {
      document.body.className = `bg-theme-${themeId} ${
        themeId === 'baseball' ? 'body-sports-mode' : 
        themeId === 'camping' ? 'body-camping-mode' : 
        themeId === 'hotspring' ? 'body-hotspring-mode' : 
        themeId === 'railway' ? 'body-railway-mode' : 
        themeId === 'nightmarket' ? 'body-nightmarket-mode' : ''
      }`;
      const container = document.getElementById("theme-dynamic-particles");
      if (!container) return;

      if (themeId === "islands") {
        // 離島跳島：水裡游泳氣泡動畫 (Underwater bubbles)
        let bubblesHTML = "";
        for (let i = 0; i < 16; i++) {
          const left = Math.random() * 96 + 2;
          const size = Math.floor(Math.random() * 26) + 14;
          const dur = (Math.random() * 4 + 6).toFixed(1);
          const delay = (Math.random() * 6).toFixed(1);
          bubblesHTML += `<div class="bubble-particle" style="left: ${left}%; width: ${size}px; height: ${size}px; animation-duration: ${dur}s; animation-delay: ${delay}s;"></div>`;
        }
        container.innerHTML = bubblesHTML;
      } else if (themeId === "hualien") {
        // 花東縱谷：山溪瀑布水流落下 (Cascading streams)
        let streamsHTML = "";
        for (let i = 0; i < 14; i++) {
          const left = Math.random() * 96 + 2;
          const h = Math.floor(Math.random() * 70) + 90;
          const dur = (Math.random() * 1.5 + 2.5).toFixed(1);
          const delay = (Math.random() * 4).toFixed(1);
          streamsHTML += `<div class="water-stream-line" style="left: ${left}%; height: ${h}px; animation-duration: ${dur}s; animation-delay: ${delay}s;"></div>`;
        }
        container.innerHTML = streamsHTML;
      } else if (themeId === "northcoast") {
        // 北海岸：海浪湧動 (Rolling Ocean Waves)
        container.innerHTML = `
          <div class="ocean-wave-layer"></div>
          <div class="ocean-wave-layer-2"></div>
        `;
      } else if (themeId === "baseball") {
        // 運動賽事：黑色背景 ＋ 籃球閃過速度感與極速光束
        let sportsHTML = `
          <div class="basketball-speed-container">
            <div class="fast-basketball-wrap ball-pass-1">
              <div class="basketball-tail"></div>
              <div class="spinning-basketball">
                <div class="ball-seam-horizontal"></div>
                <div class="ball-seam-vertical"></div>
              </div>
            </div>
            <div class="fast-basketball-wrap ball-pass-2">
              <div class="basketball-tail"></div>
              <div class="spinning-basketball">
                <div class="ball-seam-horizontal"></div>
                <div class="ball-seam-vertical"></div>
              </div>
            </div>
          </div>
        `;
        for (let i = 0; i < 14; i++) {
          const left = Math.random() * 92 + 4;
          const h = Math.floor(Math.random() * 70) + 110;
          const dur = (Math.random() * 0.7 + 0.9).toFixed(1);
          const delay = (Math.random() * 2.5).toFixed(1);
          sportsHTML += `<div class="sports-speed-particle" style="left: ${left}%; height: ${h}px; animation-duration: ${dur}s; animation-delay: -${delay}s;"></div>`;
        }
        container.innerHTML = sportsHTML;
      } else if (themeId === "camping") {
        // 秘境露營：冰島極光光影搖晃波動特效 (Iceland Aurora Borealis with Undulating Light Waves)
        let auroraHTML = `
          <div class="iceland-aurora-stage">
            <div class="aurora-curtain-primary"></div>
            <div class="aurora-curtain-secondary"></div>
            <div class="aurora-curtain-neon"></div>
        `;
        for (let i = 0; i < 9; i++) {
          const left = 7 + i * 11 + Math.random() * 4;
          const dur = (Math.random() * 3 + 4.5).toFixed(1);
          const delay = (Math.random() * 4).toFixed(1);
          const opacity = (Math.random() * 0.3 + 0.45).toFixed(2);
          const width = Math.floor(Math.random() * 22) + 16;
          auroraHTML += `<div class="aurora-ray-beam" style="left: ${left}%; width: ${width}px; animation-duration: ${dur}s; animation-delay: -${delay}s; opacity: ${opacity};"></div>`;
        }
        for (let i = 0; i < 26; i++) {
          const left = Math.random() * 96 + 2;
          const top = Math.random() * 65 + 3;
          const size = (Math.random() * 2.2 + 1.2).toFixed(1);
          const dur = (Math.random() * 3 + 2).toFixed(1);
          const delay = (Math.random() * 3).toFixed(1);
          auroraHTML += `<div class="aurora-star" style="left: ${left}%; top: ${top}%; width: ${size}px; height: ${size}px; animation-duration: ${dur}s; animation-delay: -${delay}s;"></div>`;
        }
        auroraHTML += `</div>`;
        container.innerHTML = auroraHTML;
      } else if (themeId === "hotspring") {
        // 名湯溫泉：深藍色泉池 ＋ 白煙繚繞裊裊冒煙 (Deep Blue Onsen & Rising Vapor)
        let steamHTML = `
          <div class="onsen-stage-wrap">
            <div class="onsen-water-glow"></div>
        `;
        for (let i = 0; i < 16; i++) {
          const left = Math.random() * 92 + 4;
          const size = Math.floor(Math.random() * 120) + 130;
          const dur = (Math.random() * 4 + 6).toFixed(1);
          const delay = (Math.random() * 6).toFixed(1);
          const blur = Math.floor(Math.random() * 15) + 25;
          steamHTML += `<div class="onsen-steam-plume" style="left: ${left}%; width: ${size}px; height: ${size}px; filter: blur(${blur}px); animation-duration: ${dur}s; animation-delay: -${delay}s;"></div>`;
        }
        steamHTML += `</div>`;
        container.innerHTML = steamHTML;
      } else if (themeId === "nightmarket") {
        // 夜市小吃：黑色背景 ＋ 熱鬧街景五彩燈光閃耀著 (Night Market Glowing Street Bokeh)
        let marketHTML = `
          <div class="nightmarket-stage-wrap">
            <div class="nightmarket-ambient-glow"></div>
        `;
        const neonColors = [
          "radial-gradient(circle, rgba(239, 68, 68, 0.9) 0%, rgba(249, 115, 22, 0.45) 60%, transparent 80%)",
          "radial-gradient(circle, rgba(245, 158, 11, 0.9) 0%, rgba(234, 179, 8, 0.4) 60%, transparent 80%)",
          "radial-gradient(circle, rgba(236, 72, 153, 0.85) 0%, rgba(168, 85, 247, 0.4) 60%, transparent 80%)",
          "radial-gradient(circle, rgba(6, 182, 212, 0.9) 0%, rgba(59, 130, 246, 0.4) 60%, transparent 80%)",
          "radial-gradient(circle, rgba(251, 191, 36, 0.95) 0%, rgba(245, 158, 11, 0.45) 60%, transparent 80%)"
        ];
        const neonShadows = [
          "0 0 22px rgba(239, 68, 68, 0.85)",
          "0 0 22px rgba(245, 158, 11, 0.85)",
          "0 0 22px rgba(236, 72, 153, 0.85)",
          "0 0 22px rgba(6, 182, 212, 0.85)",
          "0 0 22px rgba(251, 191, 36, 0.85)"
        ];
        for (let i = 0; i < 26; i++) {
          const left = Math.random() * 94 + 3;
          const top = Math.random() * 85 + 5;
          const size = Math.floor(Math.random() * 26) + 16;
          const colorIdx = i % neonColors.length;
          const dur = (Math.random() * 2.5 + 2).toFixed(1);
          const delay = (Math.random() * 3).toFixed(1);
          marketHTML += `<div class="market-neon-bokeh" style="left: ${left}%; top: ${top}%; width: ${size}px; height: ${size}px; background: ${neonColors[colorIdx]}; box-shadow: ${neonShadows[colorIdx]}; animation: neonBlink ${dur}s ease-in-out infinite alternate; animation-delay: -${delay}s;"></div>`;
        }
        for (let i = 0; i < 18; i++) {
          const left = Math.random() * 92 + 4;
          const top = Math.random() * 65 + 5;
          const dur = (Math.random() * 1.5 + 1.2).toFixed(1);
          const delay = (Math.random() * 2.5).toFixed(1);
          marketHTML += `<div class="market-sparkle-star" style="left: ${left}%; top: ${top}%; animation: starSparkle ${dur}s ease-in-out infinite alternate; animation-delay: -${delay}s;">✦</div>`;
        }
        marketHTML += `</div>`;
        container.innerHTML = marketHTML;
      } else if (themeId === "railway") {
        // 經典鐵道：暗色系 ＋ 搶眼橘色探照燈與夜霧穿梭 (Dark Railway & Amber Beam)
        let railwayHTML = `
          <div class="railway-stage-wrap">
            <div class="train-headlight-beam"></div>
        `;
        for (let i = 0; i < 7; i++) {
          const left = Math.random() * 80 + 5;
          const top = Math.random() * 70 + 15;
          const dur = (Math.random() * 6 + 10).toFixed(1);
          const delay = (Math.random() * 5).toFixed(1);
          railwayHTML += `<div class="forest-mist" style="left: ${left}%; top: ${top}%; animation-duration: ${dur}s; animation-delay: -${delay}s; opacity: 0.35;"></div>`;
        }
        railwayHTML += `</div>`;
        container.innerHTML = railwayHTML;
      }
    }
        container.innerHTML = mistHTML;
      }
    }

    // 防抖輔助函數
    function debounce(fn, wait) {
      let timer;
      return function (...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), wait);
      };
    }

    window.addEventListener("DOMContentLoaded", initThemesPage);
  </script>
